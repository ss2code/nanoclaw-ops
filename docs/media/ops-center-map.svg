<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Ops Center feature map</title>
  <desc id="desc">An illustrative map of Ops Center: Overview shows fleet health and usage; Runs and Logs explain execution; Chat reaches an agent; Models, Skills, and Connections configure it.</desc>
